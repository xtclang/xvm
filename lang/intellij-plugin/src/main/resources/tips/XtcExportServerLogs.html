<p><b>Attach the Ecstasy server's logs to a bug report</b></p>
<p>
    <span class="control">Tools | Export Ecstasy Server Logs</span> saves the language server's recent logs, timing
    traces and status as one ZIP file, to attach to an issue. Press
    <span class="shortcut">&shortcut:GotoAction;</span> and type "Export Ecstasy" to find it from anywhere.
</p>
