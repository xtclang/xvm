<p><b>Restart the Ecstasy language server</b></p>
<p>
    Press <span class="shortcut">&shortcut:xtc.restartLanguageServer;</span>
    (<span class="control">Tools | Restart Ecstasy Language Server</span>) to restart the server with its adapter and
    the runtime settings saved in
    <span class="control">Settings | Languages &amp; Frameworks | Ecstasy | Server Runtime and Logs</span>.
</p>
