<p><b>Show the Ecstasy language server's log</b></p>
<p>
    Press <span class="shortcut">&shortcut:xtc.toggleServerLog;</span>
    (<span class="control">Tools | Toggle Ecstasy Language Server Log</span>) to open the server's log in the
