<body>
<p><b>Run an Ecstasy module or all of its tests</b></p>
<p>
    Click <span class="control">&#9654; Run</span> above an Ecstasy module declaration to build the module and run
    it, the way the Ecstasy build mode says.
</p>
<p>
    To run every Ecstasy test module's tests, right-click a folder in the <span class="control">Project</span> tool
    window and choose <span class="control">Run All Ecstasy Tests</span>.
</p>
</body>
</html>
