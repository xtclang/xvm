name: Validate Dependabot Configuration

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: Validate Dependabot Config
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Check dependabot.yml syntax
              run: |
                  echo "📝 Checking dependabot.yml syntax..."
                  if ! command -v yamllint &> /dev/null; then
                      echo "⚠️  yamllint not available, skipping syntax check"
                  else
                      yamllint .github/dependabot.yml || echo "⚠️  yamllint warnings (non-fatal)"
                  fi
                  echo "✅ File exists and is readable"

            # GitHub removed the dependabot.yml reviewers option on 2025-08-08 (reviewers come
            # from CODEOWNERS), so there are no team references left to check. The schema catches
            # real configuration errors: unknown keys, invalid values, malformed groups.
            - name: Validate against the Dependabot schema
              run: bin/validate-dependabot-config.sh

            - name: Summary
              if: success()
              run: |
                  echo "### ✅ Dependabot Configuration Valid" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "\`.github/dependabot.yml\` matches the published Dependabot configuration schema." >> $GITHUB_STEP_SUMMARY

            - name: Summary - Failure
              if: failure()
              run: |
                  echo "### ❌ Dependabot Configuration Invalid" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "\`.github/dependabot.yml\` does not match the Dependabot configuration schema." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
